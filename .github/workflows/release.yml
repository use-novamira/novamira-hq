name: Publish desktop release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string
concurrency:
  group: desktop-release
  cancel-in-progress: false
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Require a protected-main release commit
        id: release
        run: |
          git fetch --no-tags origin main
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/main
          test "$commit" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - id: metadata
        run: node scripts/release-metadata.mjs "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  acceptance:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Desktop legal review (accepted gap for the first beta)
        continue-on-error: ${{ env.RELEASE_TAG == 'v1.0.0-beta1' }}
        run: bun run legal:desktop-check

  desktop:
    needs: [prepare, acceptance]
    name: desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: novamira-hq-desktop-linux-x86_64
            asset: novamira-hq-desktop-linux-x86_64
            binary: novamira-hq-desktop
            archive: novamira-hq-desktop-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: node scripts/desktop-build.mjs --package
      - run: bun run desktop:acceptance
      - if: runner.os == 'Linux'
        shell: bash
        run: mv "dist-desktop/${{ matrix.binary }}" "dist-desktop/${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Named for the pattern github-release downloads.
          name: ${{ matrix.artifact }}-release
          path: |
            dist-desktop/${{ matrix.asset }}
            dist-desktop/${{ matrix.archive || matrix.asset }}
          if-no-files-found: error

  windows-native:
    needs: [prepare, acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Download and checksum the native webview libraries. Upstream ships
      # webview.dll unsigned, and the app writes it to a temporary folder and
      # loads it at every launch, so it is signed before the executable embeds
      # it. WebView2Loader.dll already carries Microsoft's signature.
      - run: node scripts/windows-native.mjs dist-desktop/native-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-native-unsigned
          path: dist-desktop/native-windows/
          if-no-files-found: error

  sign-windows-native:
    needs: [windows-native]
    name: sign / webview.dll
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-native-unsigned
          path: signing
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://plc.codesigning.azure.net/
          signing-account-name: Novamira
          certificate-profile-name: ovation-public-trust
          files: ${{ github.workspace }}\signing\webview.dll
          file-digest: SHA256
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-native-signed
          path: signing/
          if-no-files-found: error

  windows-compile:
    needs: [prepare, sign-windows-native]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-native-signed
          path: dist-desktop/native-windows
      # Compile only, embedding the signed library.
      - run: node scripts/desktop-build.mjs --reuse-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-exe-unsigned
          path: dist-desktop/novamira-hq-desktop.exe
          if-no-files-found: error

  sign-windows-exe:
    needs: [windows-compile]
    name: sign / novamira-hq-desktop.exe
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe-unsigned
          path: signing
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://plc.codesigning.azure.net/
          signing-account-name: Novamira
          certificate-profile-name: ovation-public-trust
          files: ${{ github.workspace }}\signing\novamira-hq-desktop.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-exe-signed
          path: signing/
          if-no-files-found: error

  windows-package:
    needs: [prepare, sign-windows-exe]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe-signed
          path: dist-desktop
      # `--reuse-compiled` embeds the signed executable instead of recompiling.
      - run: node scripts/desktop-build.mjs --package --reuse-compiled
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-setup-unsigned
          path: dist-desktop/novamira-hq-setup-windows-x86_64.exe
          if-no-files-found: error

  sign-windows-setup:
    needs: [windows-package]
    name: sign / novamira-hq-setup-windows-x86_64.exe
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-setup-unsigned
          path: signing
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://plc.codesigning.azure.net/
          signing-account-name: Novamira
          certificate-profile-name: ovation-public-trust
          files: ${{ github.workspace }}\signing\novamira-hq-setup-windows-x86_64.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-setup-signed
          path: signing/
          if-no-files-found: error

  desktop-windows:
    needs: [prepare, sign-windows-native, sign-windows-exe, sign-windows-setup]
    name: desktop / novamira-hq-setup-windows-x86_64.exe
    runs-on: windows-latest
    env:
      ASSET: novamira-hq-setup-windows-x86_64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-native-signed
          path: dist-desktop/native-windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe-signed
          path: dist-desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-setup-signed
          path: dist-desktop
      - name: Require valid Authenticode signatures from Ovation S.r.l.
        shell: pwsh
        run: |
          foreach ($file in "dist-desktop/native-windows/webview.dll", "dist-desktop/novamira-hq-desktop.exe", "dist-desktop/$env:ASSET") {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notlike "*O=Ovation S.r.l.*") {
              throw "$file is not validly signed by Ovation S.r.l.: $($signature.Status)"
            }
            if ($null -eq $signature.TimeStamperCertificate) { throw "$file has no timestamp" }
          }
      - run: node scripts/desktop-smoke.mjs dist-desktop/novamira-hq-desktop.exe
      - run: bun run desktop:acceptance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Named for the pattern github-release downloads.
          name: novamira-hq-desktop-windows-x86_64-release
          path: dist-desktop/${{ env.ASSET }}
          if-no-files-found: error

  macos-build:
    needs: [prepare, acceptance]
    name: build / ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: novamira-hq-desktop-macos-arm64
          - runner: macos-15-intel
            asset: novamira-hq-desktop-macos-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run desktop:build
      - run: mv dist-desktop/novamira-hq-desktop "dist-desktop/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}-unsigned
          path: |
            dist-desktop/${{ matrix.asset }}
            dist/web/static/third-party-notices.txt
          if-no-files-found: error

  sign-macos:
    needs: [prepare, macos-build]
    name: sign / ${{ matrix.asset }}
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: novamira-hq-desktop-macos-arm64
          - runner: macos-15-intel
            asset: novamira-hq-desktop-macos-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.asset }}-unsigned
          path: ${{ runner.temp }}/unsigned
      # Take only the two expected regular files from the artifact.
      - run: |
          unsigned="$RUNNER_TEMP/unsigned"
          for file in "dist-desktop/$ASSET" dist/web/static/third-party-notices.txt; do
            test -f "$unsigned/$file"
            test ! -L "$unsigned/$file"
          done
          test "$(find "$unsigned" -mindepth 1 \( -type f -o -type l \) | wc -l)" -eq 2
          mkdir -p dist-desktop dist/web/static
          cp "$unsigned/dist-desktop/$ASSET" "dist-desktop/$ASSET"
          cp "$unsigned/dist/web/static/third-party-notices.txt" dist/web/static/third-party-notices.txt
          chmod +x "dist-desktop/$ASSET"
      - name: Sign, notarize and staple
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/macos-sign.sh "dist-desktop/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}-signed
          path: |
            dist-desktop/${{ matrix.asset }}
            dist-desktop/${{ matrix.asset }}.app.zip
            dist-desktop/${{ matrix.asset }}.dmg
            dist-desktop/${{ matrix.asset }}.keychain.zip
            dist-desktop/${{ matrix.asset }}.SOURCE-OFFER.txt
            dist-desktop/${{ matrix.asset }}.build-from-source.md
            dist-desktop/${{ matrix.asset }}.LGPL-2.1.txt
            dist-desktop/${{ matrix.asset }}.THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  desktop-macos:
    needs: [prepare, sign-macos]
    name: desktop / ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: novamira-hq-desktop-macos-arm64
          - runner: macos-15-intel
            asset: novamira-hq-desktop-macos-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.asset }}-signed
          path: dist-desktop
      - run: chmod +x "dist-desktop/$ASSET"
      - name: Accept signed installation artifact
        run: |
          unzip -q "dist-desktop/$ASSET.app.zip" -d "$RUNNER_TEMP/verify"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/verify/Novamira HQ.app"
          xcrun stapler validate "$RUNNER_TEMP/verify/Novamira HQ.app"
          spctl --assess --type execute -vv "$RUNNER_TEMP/verify/Novamira HQ.app"
          ditto "$RUNNER_TEMP/verify/Novamira HQ.app/Contents/Helpers/Novamira HQ Credentials.app" "native/macos/Novamira HQ Credentials.app"
      - run: node --test test/macos-keychain-contract.test.mjs
      - run: node scripts/desktop-smoke.mjs "dist-desktop/$ASSET"
      - run: node scripts/desktop-artifact-acceptance.mjs "dist-desktop/$ASSET.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}-release
          path: |
            dist-desktop/${{ matrix.asset }}
            dist-desktop/${{ matrix.asset }}.app.zip
            dist-desktop/${{ matrix.asset }}.dmg
            dist-desktop/${{ matrix.asset }}.keychain.zip
            dist-desktop/${{ matrix.asset }}.SOURCE-OFFER.txt
            dist-desktop/${{ matrix.asset }}.build-from-source.md
            dist-desktop/${{ matrix.asset }}.LGPL-2.1.txt
            dist-desktop/${{ matrix.asset }}.THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  github-release:
    needs: [prepare, desktop, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: novamira-hq-desktop-*-release
          path: release-assets
          merge-multiple: true
      - name: Publish accepted artifacts with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          cp install.sh install.ps1 LICENSE legal/SOURCE-OFFER.txt license-docs/build-from-source.md release-assets/
          cp legal/licenses/lgpl-2.1.txt release-assets/LGPL-2.1.txt
          cp release-assets/novamira-hq-desktop-macos-arm64.THIRD-PARTY-NOTICES.txt release-assets/THIRD-PARTY-NOTICES.txt
          cd release-assets
          sha256sum * > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" * --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
